# Gstack Workflow Skill Template Edit And Regenerate

## Action

Follow the skill-template-edit-and-regenerate workflow:
1. Edit one or more SKILL.md.tmpl files or scripts/resolvers/*.ts
2. Run scripts/gen-skill-docs.ts (often via bun run gen:skill-docs or build script)
3. Regenerate SKILL.md files for each skill directory (e.g., office-hours/SKILL.md, plan-eng-review/SKILL.md, etc.)
4. Regenerate Codex/Factory files if needed (.agents/skills/*/SKILL.md, .factory/skills/*/SKILL.md)
5. Commit regenerated SKILL.md and related files

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: */SKILL.md.tmpl, scripts/resolvers/*.ts, scripts/gen-skill-docs.ts

